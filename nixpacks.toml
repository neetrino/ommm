# Fallback if Coolify Build Pack stays on Nixpacks.
# Prefer root `Dockerfile` (standalone) — Nixpacks single-stage images are huge
# and often fail at "exporting layers" on small VPS disks.
providers = ["node", "python"]

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.install]
cmds = ["pnpm install --frozen-lockfile --filter web..."]

[phases.build]
cmds = [
  "pnpm run build:web",
  "rm -rf apps/mobile apps/api/src apps/api/test apps/web/.next/cache node_modules/.cache",
]

[start]
cmd = "pnpm --filter web exec next start --hostname 0.0.0.0 --port ${PORT:-3000}"
