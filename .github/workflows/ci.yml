# Quality CI: lint, typecheck, tests, and production builds.
# Runs on every pull request and on push to main.
# Node and pnpm match the root Dockerfile.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"
  # prisma generate reads these at install time and does not connect.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter api exec eslint "src/**/*.ts" "test/**/*.ts"

      - name: Lint web
        run: pnpm --filter web lint

      - name: Lint mobile
        run: pnpm --filter mobile lint

      - name: Typecheck API
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.build.json

      - name: Test API
        run: pnpm test

      - name: Test web
        run: pnpm --filter web test:unit

      - name: Build API
        run: pnpm build:api

      - name: Build web
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
